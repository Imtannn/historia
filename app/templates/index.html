<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: { DEFAULT: '#C45C26', soft: '#F3E0D4', dark: '#8B3A12', glow: '#E07840' },
            ink: { DEFAULT: '#1C1917', muted: '#78716C', faint: '#A8A29E' },
            paper: { DEFAULT: '#FAF7F2', card: '#FFFFFF', line: '#E7E0D6', deep: '#F0EBE3' },
          },
          fontFamily: {
            display: ['"Fraunces"', 'Georgia', 'serif'],
            sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            soft: '0 1px 2px rgba(28,25,23,0.04), 0 8px 24px rgba(28,25,23,0.06)',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="bg-paper text-ink font-sans antialiased min-h-screen">
  <div id="app-root" class="min-h-screen flex">
    <!-- Mobile overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-ink/30 z-30 hidden lg:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-40 h-screen w-64 bg-paper-deep border-r border-paper-line flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200">
      <div class="px-5 pt-6 pb-4">
        <a href="#/" class="block group">
          <span class="font-display text-2xl tracking-tight text-ink group-hover:text-accent transition-colors">Historia</span>
          <p class="text-xs text-ink-faint mt-0.5">World history, as you write it</p>
        </a>
      </div>

      <nav class="flex-1 px-3 space-y-0.5 overflow-y-auto" id="main-nav">
        <a href="#/" data-nav="timeline" class="nav-link">World timeline</a>
        <a href="#/progress" data-nav="progress" class="nav-link">Progress</a>
        <div class="pt-4 pb-1 px-3 text-[10px] uppercase tracking-wider text-ink-faint font-semibold">Hubs</div>
        <a href="#/library?tab=periods" data-nav="periods" class="nav-link">Periods</a>
        <a href="#/library?tab=phases" data-nav="phases" class="nav-link">Phases</a>
        <a href="#/library" data-nav="library" class="nav-link">Events</a>
        <a href="#/library?tab=countries" data-nav="countries" class="nav-link">Countries</a>
        <a href="#/library?tab=figures" data-nav="figures" class="nav-link">Figures</a>
        <div class="pt-4 pb-1 px-3 text-[10px] uppercase tracking-wider text-ink-faint font-semibold">Learn</div>
        <a href="#/library?tab=topics" data-nav="topics" class="nav-link">Topics</a>
        <a href="#/flashcards" data-nav="flashcards" class="nav-link">Flashcards</a>
        <a href="#/quiz" data-nav="quiz" class="nav-link">Quiz</a>
        <div class="pt-4 pb-1 px-3 text-[10px] uppercase tracking-wider text-ink-faint font-semibold">System</div>
        <a href="#/settings" data-nav="settings" class="nav-link">Settings</a>
      </nav>

      <div id="sidebar-streak" class="px-5 py-4 border-t border-paper-line text-sm text-ink-muted">
        <span class="inline-flex items-center gap-1.5">
          <span aria-hidden="true">🔥</span>
          <span id="streak-count">—</span>
        </span>
      </div>
    </aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen">
      <header class="sticky top-0 z-20 bg-paper/90 backdrop-blur border-b border-paper-line px-4 lg:px-8 h-14 flex items-center gap-3">
        <button id="menu-btn" type="button" class="lg:hidden p-2 -ml-2 rounded-lg hover:bg-paper-deep text-ink-muted" aria-label="Open menu">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
        </button>
        <div id="header-meta" class="flex-1 text-sm text-ink-muted truncate"></div>
        <div id="header-xp" class="text-sm font-medium text-accent tabular-nums"></div>
        <button id="quick-add-btn" type="button" class="btn-primary text-sm px-3 py-1.5">+ Add event</button>
      </header>

      <main id="view" class="flex-1 px-4 lg:px-8 py-6 max-w-5xl w-full mx-auto"></main>
    </div>
  </div>

  <!-- Quick-add modal -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-ink/40" data-close-modal></div>
    <div class="absolute inset-x-0 bottom-0 sm:inset-0 sm:flex sm:items-center sm:justify-center p-0 sm:p-6">
      <div id="modal-panel" class="bg-paper-card rounded-t-2xl sm:rounded-2xl shadow-soft w-full sm:max-w-lg max-h-[90vh] overflow-y-auto p-6 relative"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] hidden px-4 py-2.5 rounded-full bg-ink text-paper text-sm shadow-soft"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
