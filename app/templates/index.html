<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: { DEFAULT: '#C45C26', soft: '#F3E0D4', dark: '#8B3A12' },
            ink: { DEFAULT: '#1C1917', muted: '#78716C', faint: '#A8A29E' },
            paper: { DEFAULT: '#FAF7F2', card: '#FFFFFF', line: '#E7E0D6' },
          },
          fontFamily: {
            display: ['"Fraunces"', 'Georgia', 'serif'],
            sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="bg-paper text-ink font-sans antialiased min-h-screen">
  <div id="app" class="min-h-screen flex items-center justify-center p-8">
    <div class="text-center">
      <h1 class="font-display text-4xl text-ink mb-2">Historia</h1>
      <p class="text-ink-muted">Loading…</p>
      <p id="health" class="mt-4 text-sm text-ink-faint"></p>
    </div>
  </div>
  <script type="module" src="/static/js/boot.js"></script>
</body>
</html>
